name: Build Android App (.aab & .apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          cd app/frontend
          npm install
          npm run build

      - name: Generate Android App Bundle (.aab)
        uses: pwa-builder/pwabuilder-action@v1.0.1
        with:
          manifest-url: "https://7datawin-live.vercel.app/manifest.json"
          output-dir: "android-build"

      - name: Download Bundletool & Generate Test APK
        run: |
          wget -q https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar
          AAB_FILE=$(find android-build -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            java -jar bundletool.jar build-apks --bundle="$AAB_FILE" --output=7DataWin.apks --mode=universal
            unzip 7DataWin.apks -d apks_out
            cp apks_out/universal.apk android-build/7DataWin-Test.apk
            echo "Successfully generated 7DataWin-Test.apk"
          fi

      - name: Upload .aab and .apk files to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7DataWin-Android-Files-APK-and-AAB
          path: android-build/
